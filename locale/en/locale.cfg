[mod-name]
WePlayTrainsGetRadar=WePlay: Trains Get Radar

[mod-description]
WePlayTrainsGetRadar=Every locomotive charts the map around it like a radar.

[mod-setting-name]
wp-trains-radar-radius=Radar radius (chunks)
wp-trains-radar-interval=Scan interval (ticks)
wp-trains-radar-parked-interval=Parked train refresh (seconds)

[mod-setting-description]
wp-trains-radar-radius=How many chunks around each locomotive are charted. 0 charts only the chunk the locomotive is in, 2 charts a 5×5 chunk area (like a vanilla radar's nearby area).
wp-trains-radar-interval=How often each moving locomotive charts its area, in ticks (60 ticks = 1 second). The work is spread evenly across ticks, so large train networks don't cause spikes.
wp-trains-radar-parked-interval=How often a stopped locomotive refreshes its area, in seconds. 0 means parked trains never chart until they move again.
